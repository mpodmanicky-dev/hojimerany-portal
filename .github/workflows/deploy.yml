name: Build & Deploy to Azure VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      repo_lower: ${{ steps.repo_lower.outputs.repo }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_lower
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO_LOWER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.repo }}:latest
            ghcr.io/${{ steps.repo_lower.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VPS (Port 3003)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            echo "==> Deploying hojimerany-portal to Azure VPS on localhost:3003..."

            # Priečinok pre aplikáciu na serveri
            APP_DIR="~/apps/hojimerany-portal"
            sudo mkdir -p $APP_DIR
            sudo chown -R ${{ secrets.AZURE_USER }}:${{ secrets.AZURE_USER }} $APP_DIR
            cd $APP_DIR

            REPO_LOWER="${{ needs.build-and-push.outputs.repo_lower }}"

            # Príprava docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            services:
              hojimerany-portal:
                image: ghcr.io/${REPO_LOWER}:latest
                container_name: hojimerany-portal
                restart: always
                ports:
                  - "127.0.0.1:3003:3000"
                environment:
                  - NODE_ENV=production
                  - PORT=3000
                  - HOSTNAME=0.0.0.0
                healthcheck:
                  test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 10s
            EOF

            # Prihlásenie do GHCR na stiahnutie privátneho/verejného imagu
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull a reštart kontajnera
            docker compose pull
            docker compose up -d --remove-orphans

            # Vyčistenie starých neaktívnych obrazov
            docker image prune -f

            echo "==> Deployment úspešný! Aplikácia beží na 127.0.0.1:3003."
            docker ps --filter "name=hojimerany-portal"

